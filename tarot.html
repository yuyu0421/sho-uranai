<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="翔タロット">
<meta name="theme-color" content="#0B2E33">
<title>翔のタロット｜3枚から選ぶ恋愛リーディング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0B2E33; --water:#1F6F78; --line:#6FA8AC; --mist:#DCEBE9;
  --brass:#C8B27A; --paper:#E8F0EE; --ink:#1D4C52;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--deep:#0B2E33;--water:#1F6F78;--line:#6FA8AC;--mist:#DCEBE9;--brass:#C8B27A;--paper:#E8F0EE;--ink:#1D4C52;}
}
:root[data-theme="dark"]{--deep:#0B2E33;--water:#1F6F78;--line:#6FA8AC;--mist:#DCEBE9;--brass:#C8B27A;--paper:#E8F0EE;--ink:#1D4C52;}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--deep);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--deep);color:var(--mist);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.mincho{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}

#stage{
  position:relative;height:100%;
  width:min(100%, calc(100dvh * 9 / 16));
  container-type:size;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 44%, #1F6F78 0%, #165660 42%, #0B2E33 100%);
  user-select:none;-webkit-user-select:none;
}
#bgr{position:absolute;left:50%;top:46%;width:190cqw;height:190cqw;transform:translate(-50%,-50%);pointer-events:none;opacity:.55}

#header{position:absolute;top:5cqh;left:0;right:0;padding:0 8cqw;text-align:center;opacity:0}
#brand{font-size:3.2cqw;letter-spacing:.35em;color:var(--line)}
#theme{font-weight:700;font-size:6.4cqw;line-height:1.55;margin-top:1.6cqh;white-space:pre-line}

#table{position:absolute;left:50%;top:46%;width:0;height:0}
.card{
  position:absolute;width:27cqw;height:calc(27cqw * 1.68);
  left:-13.5cqw;top:calc(27cqw * -0.84);
  perspective:1400px;will-change:transform;
}
.inner{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:1.6cqw;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:var(--water);transform:translateZ(.1px);box-shadow:0 1.2cqw 3cqw rgba(3,20,23,.45)}
.back svg{width:100%;height:100%;display:block}
.front{transform:rotateY(180deg) translateZ(.1px);background:var(--paper);color:var(--ink);box-shadow:0 1.2cqw 3cqw rgba(3,20,23,.45)}
.fwrap{
  position:absolute;inset:1.3cqw;border:.3cqw solid rgba(29,76,82,.45);border-radius:1cqw;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2.2cqw 1cqw 2.4cqw;
}
.fwrap.rev{transform:rotate(180deg)}
.fwrap .num{font-size:3.4cqw;letter-spacing:.12em;color:#7E6A3C}
.fwrap svg{width:68%;height:auto;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fwrap .jp{font-weight:700;line-height:1.2;text-align:center}
.fwrap .en{font-size:2.3cqw;font-style:italic;opacity:.75;margin-top:.5cqw}
.glow .back{box-shadow:0 0 0 .5cqw rgba(200,178,122,.75),0 1.2cqw 3cqw rgba(3,20,23,.45)}

.slotlabel{position:absolute;left:-5cqw;top:0;width:10cqw;text-align:center;font-size:5.4cqw;color:var(--mist);opacity:0}
.ripple{position:absolute;width:34cqw;height:34cqw;left:-17cqw;top:-17cqw;border-radius:50%;border:.35cqw solid var(--line);pointer-events:none;z-index:150;opacity:0}

#caption{position:absolute;left:7cqw;right:7cqw;bottom:6cqh;text-align:center}
#caption p{margin:0}
.soft{font-size:4cqw;color:var(--line);letter-spacing:.06em;line-height:1.8}
.lead{font-size:5.4cqw;line-height:1.6}
.count{font-size:12cqw;color:var(--brass);margin-top:1.5cqh;line-height:1.2;height:1.2em}
.pick{font-size:3.4cqw;color:var(--line);letter-spacing:.1em;margin-bottom:1.2cqh}
.kw{font-weight:700;font-size:6.4cqw;line-height:1.3}
.kw span{display:block;font-weight:500;font-size:4.4cqw;color:var(--brass);margin-top:.8cqh}
.pos{display:inline-block;font-size:3cqw;border:.25cqw solid var(--line);color:var(--line);padding:.25em .9em;border-radius:99px;margin-top:1.2cqh}
.text{font-size:4.1cqw;line-height:1.9;margin-top:1.6cqh !important;text-wrap:pretty}
.closing{font-size:4.3cqw;line-height:1.8;white-space:pre-line;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}

#setup{
  position:absolute;inset:0;z-index:500;overflow-y:auto;
  background:rgba(9,38,42,.95);padding:28px 24px 40px;font-size:15px;line-height:1.7;
}
#setup h1{font-size:22px;margin:0 0 4px;font-weight:700}
#setup .sub{color:var(--line);font-size:13px;margin:0 0 22px}
.field{margin-bottom:18px}
.field label,.field .lab{display:block;font-size:13px;color:var(--line);margin-bottom:6px}
#setup textarea,#setup input[type=text],#setup select{
  width:100%;font:inherit;font-size:16px;color:var(--mist);background:rgba(255,255,255,.06);
  border:1px solid rgba(111,168,172,.5);border-radius:8px;padding:10px 12px;resize:vertical;
}
#setup select option{color:#111}
.row{display:flex;gap:12px}
.row .field{flex:1}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mist)}
.check input{width:20px;height:20px;accent-color:var(--line)}
button{font:inherit;cursor:pointer}
.primary{
  width:100%;margin-top:6px;padding:14px;border:0;border-radius:999px;
  background:var(--line);color:var(--deep);font-size:16px;font-weight:700;
}
.note{font-size:12.5px;opacity:.8;margin-top:14px;line-height:1.75}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#endbar{position:absolute;top:2.5cqh;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:400;opacity:0;pointer-events:none;transition:opacity .3s}
#endbar.show{opacity:1;pointer-events:auto}
#endbar button{background:rgba(9,38,42,.85);color:var(--mist);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px}
</style>
</head>
<body>
<div id="stage">
  <svg id="bgr" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="#6FA8AC">
      <circle cx="100" cy="100" r="14" stroke-opacity=".16"/>
      <circle cx="100" cy="100" r="28" stroke-opacity=".13"/>
      <circle cx="100" cy="100" r="44" stroke-opacity=".10"/>
      <circle cx="100" cy="100" r="62" stroke-opacity=".08"/>
      <circle cx="100" cy="100" r="82" stroke-opacity=".06"/>
      <circle cx="100" cy="100" r="99" stroke-opacity=".04"/>
    </g>
  </svg>

  <div id="header">
    <div id="brand" class="mincho">明鏡止水の翔</div>
    <div id="theme" class="mincho"></div>
  </div>

  <div id="table"></div>
  <div id="caption" aria-live="polite"></div>

  <div id="endbar">
    <button id="again">もう一度引く</button>
    <button id="back">設定を変える</button>
  </div>

  <div id="setup">
    <h1 class="mincho">3枚から選ぶタロット</h1>
    <p class="sub">恋愛リーディング｜録画用</p>

    <div class="field">
      <label for="f-brand">上に出す名前</label>
      <input type="text" id="f-brand" value="明鏡止水の翔">
    </div>
    <div class="field">
      <label for="f-theme">テーマ（改行もそのまま出ます）</label>
      <textarea id="f-theme" rows="2">あの人は今、
あなたをどう思っている？</textarea>
    </div>
    <div class="row">
      <div class="field">
        <label for="f-mode">めくり方</label>
        <select id="f-mode">
          <option value="auto">自動で進む</option>
          <option value="tap">タップで進む</option>
        </select>
      </div>
      <div class="field">
        <label for="f-wait">選ぶ時間</label>
        <select id="f-wait">
          <option value="3">3秒</option>
          <option value="5" selected>5秒</option>
          <option value="8">8秒</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="f-hold">1枚の結果を見せる時間（自動のとき）</label>
      <select id="f-hold">
        <option value="6">6秒</option>
        <option value="8" selected>8秒</option>
        <option value="11">11秒</option>
      </select>
    </div>
    <div class="field">
      <label class="check"><input type="checkbox" id="f-rev"> 逆位置も出す</label>
    </div>
    <div class="field">
      <label for="f-close">最後に出す一言</label>
      <textarea id="f-close" rows="2">あの人との相性は
プロフィールのリンクから無料で占えます</textarea>
    </div>

    <button class="primary" id="start">シャッフルを始める</button>
    <p class="note">先に画面収録を始めてから押してください。始めるとこの設定は隠れます。最後の画面をタップすると「もう一度引く」が出ます。</p>
  </div>
</div>

<script>
(() => {
const BACK = `<svg viewBox="0 0 100 168" preserveAspectRatio="none" aria-hidden="true">

const $ = s => document.querySelector(s);
const stage = $('#stage'), table = $('#table'), caption = $('#caption');

const EO = 'cubic-bezier(.2,.8,.2,1)';

let W = 0, H = 0, cw = 0, ch = 0;
let S = {}, state = 'idle', running = false, tapResolve = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const T = (x, y, r = 0, s = 1) => `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
function rnd(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffleArr(a){ for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function measure(){ const r = stage.getBoundingClientRect(); W = r.width; H = r.height; cw = W * 0.27; ch = cw * 1.68; }

function anim(el, frames, dur, easing = EIO, delay = 0){
  const a = el.animate(frames, {duration: dur, easing, delay, fill: 'forwards'});
  return a.finished.then(() => {
    const last = frames[frames.length - 1];
    for (const k in last) if (k !== 'offset') el.style[k] = last[k];
    a.cancel();
  }).catch(() => {});
}
const cur = el => el.style.transform || T(0, 0);
const op = el => (el.style.opacity === '' ? '1' : el.style.opacity);

function front(c, rev){
  const size = c.jp.length >= 5 ? 3.3 : c.jp.length === 4 ? 3.9 : 4.6;
  return `<div class="face front"><div class="fwrap${rev ? ' rev' : ''}">
    <div class="num mincho">${c.n}</div>
    <svg viewBox="0 0 100 100" aria-hidden="true">${c.g}</svg>
    <div><div class="jp mincho" style="font-size:${size}cqw">${c.jp}</div><div class="en mincho">${c.en}</div></div>
  </div></div>`;
}
function cardEl(c, rev){
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="inner"><div class="face back">${BACK}</div>${c ? front(c, rev) : ''}</div>`;
  table.appendChild(el);
  return el;
}

async function hideCaption(){ await anim(caption, [{opacity: op(caption)}, {opacity: 0}], 260); }
async function setCaption(html){
  await hideCaption();
  caption.innerHTML = html;
  await anim(caption, [{opacity: 0, transform: 'translateY(1.5cqh)'}, {opacity: 1, transform: 'translateY(0)'}], 520, EO);
}
function ripple(x, y){
  for (let k = 0; k < 3; k++) {
    const r = document.createElement('div');
    r.className = 'ripple';
    table.appendChild(r);
    anim(r, [{transform: T(x, y, 0, .45), opacity: .85}, {transform: T(x, y, 0, 3.4), opacity: 0}], 2000, 'cubic-bezier(.1,.6,.3,1)', k * 300)
      .then(() => r.remove());
  }
}
function waitTap(){ return new Promise(r => { tapResolve = r; }); }

stage.addEventListener('click', e => {
  if (e.target.closest('#setup') || e.target.closest('#endbar')) return;
  if (tapResolve) { const r = tapResolve; tapResolve = null; r(); return; }
  if (state === 'end') endbar.classList.toggle('show');
});

function readSettings(){
  S = {
    brand: $('#f-brand').value.trim(),
    theme: $('#f-theme').value.trim(),
    mode: $('#f-mode').value,
    wait: +$('#f-wait').value,
    hold: +$('#f-hold').value * 1000,
    rev: $('#f-rev').checked,
    closing: $('#f-close').value.trim()
  };
}

async function run(){
  if (running) return;
  running = true; state = 'run';
  endbar.classList.remove('show');
  measure();
  table.innerHTML = '';
  caption.innerHTML = ''; caption.style.opacity = 0;
  header.style.opacity = 0;
  brandEl.textContent = S.brand;
  themeEl.textContent = S.theme;

  await sleep(500);
  anim(header, [{opacity: 0, transform: 'translateY(-1.5cqh)'}, {opacity: 1, transform: 'translateY(0)'}], 900, EO);

  // 山札
  const N = 12, deck = [];
  for (let i = 0; i < N; i++) {
    const el = cardEl();
    el.style.zIndex = i; el.style.opacity = 0; el.style.transform = T(0, ch * .12 - i * .5);
    deck.push(el);
  }
  await Promise.all(deck.map((el, i) => anim(el, [{opacity: 0, transform: cur(el)}, {opacity: 1, transform: T(0, -i * .5)}], 520, EO, 300 + i * 25)));
  setCaption('<p class="soft">心の中で、あの人を思い浮かべてください</p>');

  // リフル（左右に割って混ぜる）×3
  for (let r = 0; r < 3; r++) {
    await Promise.all(deck.map((el, i) => {
      const s = i % 2 ? 1 : -1;
      return anim(el, [{transform: cur(el)}, {transform: T(s * cw * .62, -i * .5 + (s > 0 ? -ch * .03 : ch * .03), s * 6)}], 360, EIO, i * 10);
    }));
    shuffleArr(deck);
    deck.forEach((el, k) => { el.style.zIndex = k; });
    await Promise.all(deck.map((el, k) => anim(el, [{transform: cur(el)}, {transform: T(0, -k * .5)}], 250, EIO, k * 30)));
  }

  // 扇状に広げて、また集める
  const R = ch * 1.05;
  await Promise.all(deck.map((el, k) => {
    const a = -55 + 110 * k / (N - 1), rad = a * Math.PI / 180;
    return anim(el, [{transform: cur(el)}, {transform: T(Math.sin(rad) * R, (1 - Math.cos(rad)) * R * .5 - ch * .08, a * .85)}], 720, EO, k * 22);
  }));
  await sleep(450);
  await Promise.all(deck.map((el, k) => anim(el, [{transform: cur(el)}, {transform: T(0, -k * .5)}], 520, EIO, (N - 1 - k) * 18)));

  // カット
  const topHalf = deck.slice(6), bottom = deck.slice(0, 6);
  await Promise.all(topHalf.map((el, k) => anim(el, [{transform: cur(el)}, {transform: T(cw * .95, -ch * .12 - k * .5, 8)}], 340, EIO)));
  const reordered = topHalf.concat(bottom);
  reordered.forEach((el, k) => { el.style.zIndex = k; });
  await Promise.all(reordered.map((el, k) => anim(el, [{transform: cur(el)}, {transform: T(0, -k * .5)}], 340, EIO)));
  await sleep(250);

  // 山札を下へ
  const deckY = ch * .86;
  await Promise.all(reordered.map((el, k) => anim(el, [{transform: cur(el)}, {transform: T(0, deckY - k * .4, 0, .8)}], 500, EIO, k * 8)));

  // 3枚を配る
  const idx = shuffleArr([...Array(CARDS.length).keys()]).slice(0, 3);
  const picks = idx.map(i => ({c: CARDS[i], rev: S.rev && rnd(2) === 1}));
  const slots = [-1.1 * cw, 0, 1.1 * cw];
  const deal = picks.map((p, i) => {
    const el = cardEl(p.c, p.rev);
    el.style.zIndex = 100 + i; el.style.transform = T(0, deckY - 6, 0, .8);
    return el;
  });
  hideCaption();
  for (let i = 0; i < 3; i++) {
    const rr = rnd(17) - 8;
    anim(deal[i], [
      {transform: cur(deal[i])},
      {transform: T(slots[i] * .55, -ch * .2, rr, 1.06), offset: .55},
      {transform: T(slots[i], 0)}
    ], 620, EO);
    await sleep(300);
  }
  await sleep(450);
  await Promise.all(reordered.map(el => anim(el, [{opacity: 1, transform: cur(el)}, {opacity: 0, transform: T(0, deckY + ch * .1, 0, .7)}], 420, EIO)));
  reordered.forEach(el => el.remove());

  // A・B・C
  const labels = ['A', 'B', 'C'].map((t, i) => {
    const l = document.createElement('div');
    l.className = 'slotlabel mincho'; l.textContent = t;
    l.style.transform = T(slots[i], ch / 2 + W * .03);
    table.appendChild(l);
    anim(l, [{opacity: 0}, {opacity: 1}], 500, EO, i * 120);
    return l;
  });

  // 選ぶ時間
  await setCaption('<p class="lead mincho">直感で1枚、選んでください</p><div class="count mincho" id="count"></div>');
  const countEl = $('#count');
  for (let s = S.wait; s > 0; s--) {
    countEl.textContent = s;
    countEl.animate([{opacity: 0, transform: 'scale(.85)'}, {opacity: 1, transform: 'scale(1)'}, {opacity: .6}], {duration: 950, easing: EO});
    const k = (S.wait - s) % 3, c = deal[k];
    c.classList.add('glow');
    anim(c, [{transform: T(slots[k], 0)}, {transform: T(slots[k], -ch * .05, 0, 1.04), offset: .4}, {transform: T(slots[k], 0)}], 900, EIO)
      .then(() => c.classList.remove('glow'));
    await sleep(1000);
  }
  await setCaption('<p class="lead mincho">A から順に、めくっていきます</p>');
  await sleep(1300);

  // めくる
  const focusY = -H * .05;
  for (let i = 0; i < 3; i++) {
    const el = deal[i], p = picks[i];
    if (S.mode === 'tap' && i === 0) await waitTap();
    el.style.zIndex = 200;
    deal.forEach((d, j) => { if (j !== i) anim(d, [{opacity: op(d)}, {opacity: 0}], 450); });
    labels.forEach(l => anim(l, [{opacity: op(l)}, {opacity: 0}], 450));
    await Promise.all([hideCaption(), anim(el, [{transform: cur(el)}, {transform: T(0, focusY, 0, 1.6)}], 680, EIO)]);
    await sleep(250);
    setTimeout(() => ripple(0, focusY), 380);
    await anim(el.querySelector('.inner'), [{transform: 'rotateY(0deg)'}, {transform: 'rotateY(180deg)'}], 850, 'cubic-bezier(.3,.1,.2,1)');
    el.querySelector('.back').style.visibility = 'hidden';
    const [kw, msg] = p.rev ? p.c.rv : p.c.up;
    await setCaption(
      `<div class="pick">${'ABC'[i]} を選んだあなたへ</div>
       <div class="kw mincho">${p.c.jp}<span>${kw}</span></div>
       ${S.rev ? `<div class="pos">${p.rev ? '逆位置' : '正位置'}</div>` : ''}
       <p class="text">${msg}</p>`
    );
    if (S.mode === 'tap') await waitTap(); else await sleep(S.hold);
    await hideCaption();
    await anim(el, [{transform: cur(el)}, {transform: T(slots[i], 0)}], 620, EIO);
    el.style.zIndex = 100 + i;
  }
  deal.forEach(d => anim(d, [{opacity: op(d)}, {opacity: 1}], 500));
  labels.forEach(l => anim(l, [{opacity: op(l)}, {opacity: 1}], 500));

  // 締め
  await sleep(400);
  ripple(0, 0);
  const p = document.createElement('p');
  p.className = 'closing mincho'; p.textContent = S.closing;
  await setCaption(p.outerHTML);
  state = 'end'; running = false;
}

$('#start').addEventListener('click', async () => {
  readSettings();
  anim(setup, [{opacity: 1}, {opacity: 0}], 300).then(() => { setup.style.display = 'none'; setup.style.opacity = ''; });
  try { if (document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
  await sleep(350);
  run();
});
$('#again').addEventListener('click', () => { if (!running) run(); });
$('#back').addEventListener('click', () => {
  endbar.classList.remove('show');
  setup.style.display = ''; state = 'idle';
});
})();
</script>
