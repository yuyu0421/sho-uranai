<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#D9E6E5;
    --panel:#EFF6F5;
    --ink:#20313A;
    --ink-soft:#4F6669;
    --accent:#1F6F78;
    --accent-soft:#6FA8AC;
    --line:#B9D2D0;
    --highlight:#9C6B4F;
  }
  .numero-wrap *{ box-sizing:border-box; }
  .numero-wrap{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    max-width:560px;
    margin:0 auto;
    padding:40px 28px 48px;
    line-height:1.9;
  }
  .numero-signature{
    text-align:center;
    font-size:11.5px;
    letter-spacing:0.15em;
    color:var(--accent-soft);
    margin-bottom:10px;
  }
  .numero-ripple{
    display:block;
    margin:0 auto 18px;
  }
  .numero-lead{
    text-align:center;
    margin-bottom:32px;
  }
  .numero-lead .numero-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.04em;
    margin:0 0 12px;
  }
  .numero-lead p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
  }
  .numero-form{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:28px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .numero-form label{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .numero-date-row{
    display:flex;
    gap:10px;
  }
  .numero-select{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    color:var(--ink);
    background-color:var(--panel);
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1L6 6L11 1' fill='none' stroke='%231F6F78' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:11px 7px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 26px 10px 10px;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }
  .numero-select:focus{
    outline:none;
    border-color:var(--accent-soft);
  }
  .numero-btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    letter-spacing:0.05em;
    color:var(--accent);
    background:transparent;
    border:1px solid var(--accent);
    border-radius:3px;
    padding:11px 34px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .numero-btn:hover, .numero-btn:focus-visible{
    background:var(--accent);
    color:#fff;
    outline:none;
  }
  .numero-error{
    color:var(--highlight);
    font-size:13px;
    min-height:16px;
  }
  .numero-result{
    margin-top:36px;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity 0.6s ease;
  }
  .numero-result.is-visible{
    opacity:1;
    max-height:none;
  }
  .numero-number{
    text-align:center;
    margin-bottom:8px;
  }
  .numero-number .numero-num-label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .numero-number .numero-num-value{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:40px;
    color:var(--accent);
  }
  .numero-number .numero-num-name{
    display:block;
    font-family:'Shippori Mincho', serif;
    font-size:16px;
    margin-top:6px;
    color:var(--ink);
  }
  .numero-section{
    margin-top:30px;
  }
  .numero-section h3{
    font-family:'Shippori Mincho', serif;
    font-weight:500;
    font-size:15px;
    color:var(--accent);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .numero-section p{
    margin:0;
    font-size:15px;
    color:var(--ink);
  }
  .numero-close{
    margin-top:38px;
    padding-top:26px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .numero-close p{
    font-family:'Shippori Mincho', serif;
    font-size:15.5px;
    color:var(--ink-soft);
    margin:0;
  }
  .numero-signoff{
    display:block;
    margin-top:14px;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--accent-soft);
  }
  @media (prefers-reduced-motion: reduce){
    .numero-result{ transition:none; }
  }
</style>

<div class="numero-wrap">
  <div class="numero-lead">
    <p class="numero-signature">明鏡止水の翔</p>
    <svg class="numero-ripple" width="72" height="40" viewBox="0 0 72 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="20" r="4" fill="none" stroke="#1F6F78" stroke-width="1.3" opacity="0.85"/>
      <circle cx="36" cy="20" r="11" fill="none" stroke="#1F6F78" stroke-width="1.1" opacity="0.5"/>
      <circle cx="36" cy="20" r="18" fill="none" stroke="#1F6F78" stroke-width="0.9" opacity="0.25"/>
    </svg>
    <p class="numero-title">数秘術鑑定</p>
    <p>生年月日から、あなたの本質・これまでの意味・これからの動きを静かに読み解きます。</p>
  </div>

  <div class="numero-form">
    <label for="numero-year">生年月日を選択してください</label>
    <div class="numero-date-row">
      <select id="numero-year" class="numero-select" aria-label="年"></select>
      <select id="numero-month" class="numero-select" aria-label="月"></select>
      <select id="numero-day" class="numero-select" aria-label="日"></select>
    </div>
    <div class="numero-error" id="numero-error"></div>
    <button type="button" class="numero-btn" id="numero-submit">診断する</button>
  </div>

  <div class="numero-result" id="numero-result">
    <div class="numero-number">
      <span class="numero-num-label">あなたの運命数</span>
      <span class="numero-num-value" id="numero-num-value">-</span>
      <span class="numero-num-name" id="numero-num-name"></span>
    </div>

    <div class="numero-section">
      <h3>基本性格</h3>
      <p id="numero-personality"></p>
    </div>
    <div class="numero-section">
      <h3>今までの出来事の意味</h3>
      <p id="numero-past"></p>
    </div>
    <div class="numero-section">
      <h3>これからの動き</h3>
      <p id="numero-future"></p>
    </div>
    <div class="numero-section">
      <h3>相性のいいナンバー</h3>
      <p id="numero-compat"></p>
    </div>
    <div class="numero-section">
      <h3>気をつけるとさらによくなること</h3>
      <p id="numero-growth"></p>
    </div>

    <div class="numero-close">
      <p id="numero-message"></p>
      <span class="numero-signoff">— 明鏡止水の翔</span>
    </div>
  </div>
</div>

<script>
(function(){
  var DATA = {
    1: { name:"開拓の数",
      personality:"人に言われた通りに動くよりも、自分の意思で決めて進みたいという気持ちが強いタイプです。会議や集まりの場でも、意見を求められると自分なりの答えをはっきり持っていることが多いのではないでしょうか。物静かに見えても、内側には簡単には揺らがない芯があります。誰かの指示を待つよりも、自分から動き出すことで安心感を得られるタイプでもあります。仕事でもプライベートでも、自分のやり方や手順にこだわりを持っていることが多いのではないでしょうか。周囲からは頼りになる人、あるいは少し頑固な人と見られることもあるかもしれませんが、それはあなたが自分の判断に責任を持とうとしている証拠です。一人で抱え込みがちな面もありますが、その分だけ物事をやり遂げる力があります。",
      past:"就職や引っ越し、人間関係など、人生の節目で「周りに合わせるより自分で決めたい」と感じた場面が何度もあったはずです。その選択が遠回りに見えたときもあったかもしれませんが、それは自分の価値観を確かめるために必要な経験だったのではないでしょうか。周りから反対されても、自分の直感を信じて進んだ結果、後から振り返ると正しかったと感じた場面もあったのではないでしょうか。逆に、誰かに合わせて選んだことで、どこか納得のいかない気持ちを抱えた経験もあるかもしれません。そうした経験の一つひとつが、「自分はどう生きたいのか」という感覚を少しずつ形作ってきたはずです。遠回りに見えた道も、実際には無駄ではなく、あなたらしさを確認するための大切な過程だったのでしょう。",
      future:"誰かの期待やペースに無理に合わせる必要はありません。自分の感覚を信じて選んだ道の先には、他人と比べなくても納得できる景色が待っています。焦らず、自分のペースで一歩ずつ進んでいきましょう。大きな決断をするときほど、周囲の声よりも自分の内側の声に耳を傾けてみてください。すぐに結果が出なくても、自分で選んだ道であれば、途中で立ち止まっても納得して歩き直せるはずです。これから訪れる選択の場面でも、これまで通り自分の意思を大切にしていけば、自然と道は開けていくでしょう。",
      message:"自分の道を、自分の足で歩んでいる人です。",
      compat:"2(調和)・6(思いやり)・9(包容)の数を持つ相手とは、良い関係を築きやすいでしょう。自分の意思をしっかり持つあなたを、穏やかに受け止めてくれる相性です。特に2の数を持つ相手は、あなたが前に進む力を後ろから静かに支えてくれる存在になるでしょう。6の数を持つ相手とは、お互いに思いやりを持って接することができ、安心できる関係を築けます。9の数を持つ相手は、あなたの決断を広い心で受け止めてくれるため、無理に自分を抑える必要がありません。逆に、同じように自己主張の強いタイプとは、ぶつかり合う場面が増えるかもしれないので、少し意識しておくとよいでしょう。",
      growth:"意見をはっきり言うことは長所ですが、周りの意見を聞き入れる柔軟さも持てると、人間関係がより円滑になるでしょう。自分の考えに自信があるからこそ、他人の意見を反対意見と捉えてしまいがちですが、実際には違う視点として受け止めてみると新しい発見があるかもしれません。すべてを一人で決めようとせず、時には誰かに相談してみることも大切です。頼ることは弱さではなく、より良い判断をするための材料を増やす行為だと考えてみてください。少し肩の力を抜いて、周囲と歩調を合わせる場面を意識的に作ってみると、これまで以上に周りからの信頼を得られるようになるでしょう。" },
    2: { name:"調和の数",
      personality:"争いごとを避け、相手の気持ちを先に汲み取ってしまうタイプです。会話の中でも、自分の意見より相手の様子を優先してしまうことが多いのではないでしょうか。控えめな性格ですが、その分だけ人の感情の機微に人一倍気づける力があります。集団の中では、場の空気を読んで自然と調整役に回ることが多いはずです。誰かが困っていると、頼まれなくても自然と手を差し伸べてしまう優しさも持っています。自分から前に出るタイプではありませんが、周りからは一緒にいると安心する人として頼りにされることが多いのではないでしょうか。感情の起伏を表に出すことは少なくても、内側では人一倍繊細に物事を感じ取っています。",
      past:"職場でも家庭でも、誰かと誰かの間に立って調整役を担う場面が多かったのではないでしょうか。自分の意見を飲み込んでまで場を収めてきたことは、弱さではなく、あなたが持つ静かな強さの証です。対立を避けるために、本当は言いたいことを飲み込んだ経験も一度や二度ではないはずです。それでもその場をうまく収められたのは、あなたが人の気持ちを丁寧に汲み取ってきたからでしょう。時には、そうした我慢が積み重なって疲れを感じた瞬間もあったかもしれません。それでも人との関係を大切にしようとする姿勢を崩さなかったことは、簡単にできることではありません。",
      future:"これからは、相手の気持ちを汲み取る力をそのままに、自分自身の気持ちにも同じだけ目を向けてみてください。「本当はどうしたいか」を自分に問いかける時間を、少しずつ増やしていきましょう。誰かのために動くことは、これからも変わらずあなたの強みであり続けるはずです。ただし、自分の希望を伝える練習も並行して行っていくと、より対等な関係を築けるようになるでしょう。小さなことからでいいので、「これは譲れない」という線を自分の中に持ってみてください。それが、あなた自身を守ることにもつながっていきます。",
      message:"誰かを支える前に、自分を支えていい人です。",
      compat:"1(開拓)・4(誠実)・8(実現)の数を持つ相手と相性が良いでしょう。行動力や実行力のある相手と組むことで、あなたの調整力がより活きてきます。特に1の数を持つ相手とは、相手が前に進み、あなたがそれを支えるという役割分担がうまくいきやすいでしょう。4の数を持つ相手とは、お互いに誠実さを大切にするため、じっくりと信頼関係を築いていけます。8の数を持つ相手は、あなたの気配りを実際の形にしてくれる頼もしい存在になるはずです。逆に、同じように受け身な性質の相手とは、物事がなかなか前に進まないもどかしさを感じることがあるかもしれません。",
      growth:"自分の気持ちを後回しにしすぎると、気づかないうちに心が疲れてしまうことがあります。時には「自分はこうしたい」と伝える勇気を持てるとよいでしょう。相手に嫌われたくないという気持ちが、時に自分の本音を隠す原因になっているかもしれません。すべての場面で場を収めようとせず、時には摩擦を受け入れる勇気も必要です。小さな「NO」を積み重ねる練習をしていくと、無理をしすぎない関係の築き方が見えてくるでしょう。自分の気持ちを大切にすることは、周りへの思いやりを失うことにはつながりません。" },
    3: { name:"表現の数",
      personality:"言葉で説明するのは得意ではなくても、行動や表情、態度で気持ちを伝えるタイプです。人前で自分をアピールするのは苦手でも、内側には豊かな感受性を持っています。感じたことをすぐに言葉にするより、じっくり自分の中で温めてから表に出す傾向があります。趣味や好きなことに関しては、人が驚くほど熱心に取り組む一面も持っているのではないでしょうか。表現の仕方は静かでも、その分だけ気持ちの込め方が深いタイプです。周囲からは何を考えているか分かりにくいと言われることもあるかもしれませんが、実際には人一倍豊かな内面を持っています。",
      past:"「本当はこう思っているのに、うまく言葉にできない」ともどかしさを感じた経験が何度もあったのではないでしょうか。それでも伝えようとする姿勢を持ち続けてきたこと自体に、価値があります。気持ちをうまく表現できず、誤解されてしまった場面もあったかもしれません。それでも黙り込むのではなく、行動や態度で示そうとしてきたことは、簡単にできることではありません。うまく言葉にできないもどかしさを抱えながらも、諦めずに人と関わろうとしてきた姿勢が、今のあなたを形作っています。",
      future:"完璧な言葉を探す必要はありません。少しずつでいいので、自分のペースで気持ちを言葉や態度に出していく練習をしてみてください。伝わる相手には、必ず自然と伝わっていきます。すべての人に理解してもらおうとするより、分かってくれる相手との関係を大切にしていくとよいでしょう。うまく話せない自分を責めるのではなく、自分らしい表現方法を少しずつ見つけていってください。文章や創作など、言葉以外の形で気持ちを表すことも、あなたに合った方法の一つかもしれません。",
      message:"不器用でも、伝えようとする姿勢が誠実な人です。",
      compat:"1(開拓)・6(思いやり)・9(包容)の数を持つ相手と相性が良いでしょう。あなたの感受性を、大きく受け止めてくれる懐の深さがある組み合わせです。1の数を持つ相手とは、あなたの内面の豊かさを引き出してくれる刺激的な関係になるでしょう。6の数を持つ相手は、あなたが言葉にしきれない部分を汲み取ろうとしてくれる優しさがあります。9の数を持つ相手とは、多くを語らなくても分かり合えるような、静かで心地よい関係を築けるでしょう。逆に、せっかちで結論を急ぐタイプの相手とは、ペースの違いに戸惑う場面があるかもしれません。",
      growth:"気持ちを溜め込みすぎると、伝えたいことが伝わらないまま終わってしまうことがあります。小さなことから、少しずつ言葉にする練習をしてみましょう。誤解されることを恐れて黙ってしまうと、かえって相手との距離ができてしまうこともあります。完璧に伝えようとせず、まずは一言だけでも自分の気持ちを口に出してみてください。伝える練習を重ねるうちに、少しずつ自分の言葉に自信が持てるようになっていくはずです。" },
    4: { name:"誠実の数",
      personality:"派手さよりも、コツコツと積み上げることを大切にするタイプです。地道な作業や継続を苦にせず、地に足のついた考え方をします。物事を始める前にしっかりと計画を立て、着実に進めていくことを好むのではないでしょうか。約束や期限を守ることを大切にし、周囲からの信頼を積み重ねてきたタイプです。目立つことよりも、確実に結果を出すことに価値を感じているのではないでしょうか。真面目で誠実な姿勢は、時に融通が利かないと見られることもありますが、それだけ物事に真剣に向き合っている証拠です。",
      past:"努力してもすぐに結果が出ず、時間がかかった場面が何度もあったのではないでしょうか。それでも途中で投げ出さなかったことが、今のあなたを支える土台になっています。周りが近道を選ぶ中で、自分だけは地道な方法を選び続けてきたこともあったかもしれません。すぐに評価されないことにもどかしさを感じた瞬間もあったでしょう。それでもコツコツと積み重ねてきた経験は、確実にあなたの中に力として蓄積されています。",
      future:"焦って結果を急ぐ必要はありません。これまでと同じように、一つひとつ丁寧に積み重ねていってください。その姿勢は、必ず誰かがきちんと見ています。すぐに結果が出なくても、積み重ねてきたものはいつか必ず形になっていきます。時には計画通りにいかないこともありますが、そこで投げ出さずに調整しながら進む力があなたにはあります。これからも自分のペースを大切にしながら、着実に前進していってください。",
      message:"静かな積み重ねが、いちばん強い人です。",
      compat:"2(調和)・7(探求)・8(実現)の数を持つ相手と相性が良いでしょう。じっくり型のあなたと、同じように物事を丁寧に扱う相手との相性が良好です。2の数を持つ相手とは、お互いに誠実さを重んじるため、穏やかで安定した関係を築けるでしょう。7の数を持つ相手とは、物事をじっくり考える姿勢が似ているため、深い信頼関係を育てやすいはずです。8の数を持つ相手とは、あなたの丁寧さと相手の実行力が組み合わさり、着実に成果を出せる関係になるでしょう。逆に、変化やスピードを求めるタイプとは、ペースの違いに戸惑うことがあるかもしれません。",

    5: { name:"自由の数",
      personality:"一つの場所や考え方に縛られるより、新しい経験や視点を求めるタイプです。環境の変化にも柔軟に対応できる力があります。好奇心が旺盛で、新しいことに触れると自然と心が動くのではないでしょうか。同じ日常が続くことに、少し息苦しさを感じることもあるかもしれません。人からの束縛を嫌い、自分の裁量で動ける状況を好む傾向があります。フットワークが軽く、周囲からは行動力がある人として見られていることが多いはずです。",
      past:"転職や引っ越しなど、環境の変化が多い人生を歩んできたのではないでしょうか。それは落ち着きのなさではなく、あなたなりの学び方だったはずです。一つの場所に留まり続けることに違和感を覚え、新しい環境へ飛び込んだ経験が何度もあったのではないでしょうか。周囲からは落ち着きがないと言われたこともあるかもしれませんが、その一つひとつの経験があなたの視野を広げてきました。変化を選んできたことは、あなたなりの成長の形だったのでしょう。",
      future:"無理に一つの場所や関係に留まろうとしなくて大丈夫です。変化を恐れず、自分に合う環境や相手を探し続けることが、これからのあなたらしい生き方になります。新しい挑戦を続けることは、これからもあなたの原動力であり続けるでしょう。ただし、すべてを変え続けるのではなく、大切にしたいものは意識的に残していく視点も持ってみてください。変化と継続、そのバランスを見つけることが、これからのテーマになるはずです。",
      message:"変わり続けることを恐れない、自由な人です。",
      compat:"1(開拓)・3(表現)・7(探求)の数を持つ相手と相性が良いでしょう。変化を楽しむあなたと、それぞれ違う形で自由な発想を持つ相手との組み合わせです。1の数を持つ相手とは、お互いに新しいことへ挑戦する意欲を高め合える関係になるでしょう。3の数を持つ相手とは、感性を刺激し合いながら楽しい時間を共有できます。7の数を持つ相手とは、それぞれの自由な時間を尊重し合える、心地よい距離感の関係を築けるでしょう。逆に、安定と束縛を強く求めるタイプとは、価値観の違いに悩む場面があるかもしれません。",
      growth:"自由を求めるあまり、大切な関係を途中で手放してしまうことがあります。変化を楽しみながらも、続けることの価値にも目を向けてみましょう。新しい刺激を求めすぎると、目の前にある大切なものを見落としてしまうこともあります。すべてを変えるのではなく、続ける中にも変化を見つける視点を持ってみてください。飽きっぽさを短所と捉えず、柔軟性という長所として活かす方法を考えてみるとよいでしょう。" },
    6: { name:"思いやりの数",
      personality:"人の役に立ちたいという気持ちが強く、周囲への気配りを自然に行えるタイプです。頼まれると断れない優しさを持っています。困っている人を見ると、自分のことを後回しにしてでも手を差し伸べてしまうのではないでしょうか。家族や身近な人を大切にする気持ちが強く、面倒見の良さが自然と表れます。周囲からは頼りになる、一緒にいると安心すると言われることが多いはずです。責任感が強く、任されたことは最後まで丁寧にやり遂げようとするタイプです。",
      past:"自分のことよりも、家族や友人、恋人のことを優先してきた場面が多かったのではないでしょうか。その優しさは、言葉にされていなくても、ちゃんと相手に伝わっています。誰かのために時間や労力を使うことを、当たり前のようにこなしてきたのではないでしょうか。時には見返りを求めず尽くしたことが、報われないと感じた瞬間もあったかもしれません。それでも人を思う気持ちを手放さなかったことが、あなたという人の温かさを作ってきました。",
      future:"誰かを思いやる気持ちはそのままで構いません。ただ、その優しさの一部を、これからは自分自身にも向けてあげてください。人のために動く時間と同じくらい、自分を労わる時間も意識的に作っていってください。すべてを引き受けようとせず、時には人に任せる勇気を持つことも大切です。あなたの優しさが長く続くように、まずは自分を大切にすることから始めてみましょう。",
      message:"誰よりも人に優しい、頑張り屋な人です。",
      compat:"2(調和)・3(表現)・9(包容)の数を持つ相手と相性が良いでしょう。思いやりを大切にするあなたと、その気持ちを受け止め合える組み合わせです。2の数を持つ相手とは、お互いを気遣い合う穏やかな関係を築けるでしょう。3の数を持つ相手とは、あなたの優しさが相手の表現力を引き出すきっかけになるはずです。9の数を持つ相手とは、広い心で支え合える、深い信頼関係を育てやすいでしょう。逆に、自己主張が強く自分本位なタイプとは、一方的に尽くしすぎてしまう関係になりやすいので注意が必要です。",
      growth:"人のために動きすぎて、自分の時間や気持ちを後回しにしがちです。「no」と言う練習も、これからの課題になるでしょう。すべての頼みごとを引き受けようとすると、いつか心や体に負担がかかってしまいます。断ることは冷たいことではなく、自分を守るために必要な選択だと考えてみてください。誰かに頼る練習も並行して行うことで、より対等で健やかな関係を築いていけるはずです。" },
    7: { name:"探求の数",
      personality:"物事の表面的な部分よりも、その奥にある意味を考えるタイプです。一人の時間を大切にし、じっくり考えてから行動に移します。人と群れることよりも、静かに自分の内面と向き合う時間を好むのではないでしょうか。物事を深く分析する力があり、表面的な情報だけでは満足できない性質を持っています。口数は少なくても、頭の中では常にさまざまなことを考えているタイプです。周囲からは何を考えているか分からないと言われることもありますが、実際には誰よりも思慮深い人です。",
      past:"すぐに答えを出さず、自分の中で気持ちを消化する時間を必要としてきたのではないでしょうか。それは優柔不断さではなく、あなたの慎重さと誠実さの表れです。周りのペースに合わせて即断即決を求められる場面で、居心地の悪さを感じたこともあったかもしれません。それでも自分の納得を優先し、じっくり考える時間を確保してきたことは、簡単なことではありません。孤独を感じる瞬間もあったかもしれませんが、それはあなたが自分自身と深く向き合ってきた証でもあります。",
      future:"周りに急かされても、自分のペースを崩す必要はありません。じっくり考え抜いた末に出した判断は、きっとあなたを裏切らないはずです。一人の時間を大切にしながらも、信頼できる相手には少しずつ心を開いていくことも意識してみてください。すべてを一人で完結させようとせず、時には誰かと考えを共有することで、新しい視点が得られるはずです。じっくり考える力は、これからもあなたの大きな武器であり続けるでしょう。",
      message:"静かな時間の中で、答えを見つけられる人です。",
      compat:"4(誠実)・5(自由)・11(直感)の数を持つ相手と相性が良いでしょう。一人の時間を尊重してくれる相手との相性が特に良好です。4の数を持つ相手とは、じっくり物事を進める姿勢が似ているため、深く信頼し合える関係になるでしょう。5の数を持つ相手とは、それぞれの自由な時間を尊重し合いながら、心地よい距離感を保てます。11の数を持つ相手とは、感覚的な部分で分かり合える、静かで濃密な関係を築けるはずです。逆に、常に一緒にいることを求めるタイプとは、距離感の違いに悩むことがあるかもしれません。",
      growth:"一人で考え込みすぎると、周りとの距離ができてしまうことがあります。信頼できる人には、少しずつ胸の内を話してみるとよいでしょう。すべてを自分の中だけで処理しようとすると、孤立感を深めてしまうこともあります。考えを共有することは、弱さではなく、より深い関係を築くための一歩だと考えてみてください。少しずつでいいので、自分の内側にあるものを言葉にする練習をしてみましょう。" },
    8: { name:"実現の数",
      personality:"目標に向かって着実に進む力を持ち、責任感の強いタイプです。物事を現実的に捉え、結果を出すことを大切にします。一度決めた目標に対しては、粘り強く努力を続けられる強さを持っています。曖昧な状況を嫌い、物事をはっきりさせたいという気持ちが強いのではないでしょうか。周囲からは頼りになる、芯が強いと見られることが多いタイプです。結果を出すまで妥協しない姿勢が、周囲からの信頼にもつながっています。",
      past:"結果を求められる立場で、プレッシャーを一人で抱え込んできた場面があったのではないでしょうか。それでも投げ出さずにやり遂げてきた強さがあります。うまくいかない時期にも、弱音を吐かずに前へ進んできたことが何度もあったはずです。責任感の強さゆえに、周囲に頼ることをためらってきた場面もあったかもしれません。それでも最後までやり遂げてきた経験の積み重ねが、今のあなたの自信を形作っています。",
      future:"すべてを一人で背負い込む必要はありません。時には周りに頼ることも、あなたの力の一部です。着実な歩みは、これからも続いていきます。結果を出すことに焦点を当てすぎず、そこに至るまでの過程も大切にしてみてください。周囲の力を借りることで、これまで以上に大きな成果を出せる可能性が広がっていくはずです。着実な努力を続けていけば、望む結果は自然とついてくるでしょう。",
      message:"結果を出すために、静かに努力し続けられる人です。",
      compat:"2(調和)・4(誠実)・22(構築)の数を持つ相手と相性が良いでしょう。あなたの実行力を支え、共に形にしていける組み合わせです。2の数を持つ相手とは、あなたの推進力を穏やかに支えてくれる関係になるでしょう。4の数を持つ相手とは、堅実さを分かち合いながら、着実に物事を進めていけます。22の数を持つ相手とは、大きな構想を一緒に実現していける、頼もしいパートナーになるはずです。逆に、結果よりも過程を重視するタイプとは、価値観のすれ違いを感じることがあるかもしれません。",
      growth:"結果を追い求めるあまり、周りとの関係が後回しになることがあります。成果だけでなく、そこに至る過程も大切にしてみましょう。効率や結果を重視するあまり、身近な人の気持ちを置き去りにしてしまうこともあるかもしれません。時には立ち止まって、周囲への感謝や気配りを言葉にする時間を作ってみてください。結果と同じくらい、そこに関わった人々を大切にすることで、より豊かな成功を手にできるはずです。" },
    9: { name:"包容の数",
      personality:"広い視野で物事を捉え、人の痛みにも寄り添える性質を持っています。何かを終わらせ、次の段階へつなげる役割を担うことが多いタイプです。個人的な損得よりも、全体にとって何が良いかを考える傾向があります。人の悲しみや苦しみに敏感で、自然と寄り添おうとする優しさを持っています。物事を大きな視点で捉えるため、細かいことにこだわりすぎない懐の深さがあります。周囲からは達観している、大人びていると見られることが多いのではないでしょうか。",
      past:"大切な何かを手放したり、区切りをつけたりする経験を重ねてきたのではないでしょうか。それは喪失ではなく、次の段階へ進むために必要な準備だったはずです。人間関係や環境の変化の中で、何かを終わらせる決断を迫られる場面が何度もあったのではないでしょうか。その度に寂しさを感じながらも、前を向いて次のステージに進んできたはずです。手放すことの痛みを知っているからこそ、今のあなたの深い優しさが育まれてきました。",
      future:"過去にしがみつかなくて大丈夫です。新しい章は、あなたが思っているよりも静かに、そして確実に始まっています。終わったことを振り返るよりも、今この瞬間に目を向ける時間を増やしていってください。あなたが積み重ねてきた経験は、これから出会う人や物事にきっと活かされていくはずです。区切りをつける力を活かしながら、新しい始まりを恐れずに受け入れていきましょう。",
      message:"終わりを受け止められる、懐の深い人です。",
      compat:"3(表現)・6(思いやり)・33(慈愛)の数を持つ相手と相性が良いでしょう。あなたの広い視野を理解し、共感してくれる組み合わせです。3の数を持つ相手とは、あなたの包容力が相手の個性を引き出すきっかけになるでしょう。6の数を持つ相手とは、お互いの優しさを認め合える、温かい関係を築けます。33の数を持つ相手とは、深いレベルで価値観を分かち合える、稀有な関係になるはずです。逆に、狭い視野で物事を判断しがちなタイプとは、考え方の違いに戸惑うことがあるかもしれません。",
      growth:"物事に区切りをつけるのが得意な反面、執着すべき場面でも手放しすぎてしまうことがあります。「本当に手放していいのか」を一度立ち止まって考える時間も必要でしょう。達観しすぎるあまり、自分の本音を後回しにしてしまうこともあるかもしれません。時には感情を抑え込まず、素直に表に出してみることも大切です。手放す強さと同じくらい、大切なものをしっかり掴んでおく強さも意識してみてください。" },
    11: { name:"直感の数(マスターナンバー)",
      personality:"言葉では説明しづらい、鋭い直感と感受性を持つタイプです。人が気づかないような小さな変化にも敏感に反応します。理屈よりも感覚で物事を判断することが多く、それが的中することも少なくないのではないでしょうか。人の気持ちや場の空気を、言葉にされる前から察知してしまう繊細さを持っています。芸術的な感性や独自の視点を持ち、他の人とは違う角度から物事を見ることができます。その分、周囲から理解されにくいと感じる瞬間もあるかもしれません。",
      past:"自分の感覚をうまく言葉で説明できず、もどかしさや孤独を感じてきた場面があったのではないでしょうか。その感受性は、誰もが持っているものではありません。感じ取ったことを伝えても、周囲になかなか理解してもらえなかった経験もあったかもしれません。それでも自分の感覚を否定せず、大切に持ち続けてきたことは、簡単なことではありません。人と違う視点を持つことに、時に生きづらさを感じてきたかもしれませんが、それはあなたの個性そのものです。",
      future:"理屈で説明できなくても、自分の直感を信じて構いません。あなたが感じ取ったことには、ちゃんと意味があります。周囲に理解されなくても、自分の感覚を否定する必要はありません。これからは、自分の直感を活かせる環境や関係を選んでいくことを意識してみてください。感受性の豊かさは、これからのあなたにとって大きな武器になっていくはずです。",
      message:"言葉より先に、心で物事を感じ取れる人です。",
      compat:"2(調和)・6(思いやり)・7(探求)の数を持つ相手と相性が良いでしょう。あなたの繊細な感覚を、そっと受け止めてくれる相性です。2の数を持つ相手とは、お互いの感受性を尊重し合える穏やかな関係を築けます。6の数を持つ相手とは、あなたの繊細さを優しく包み込んでくれる存在になるでしょう。7の数を持つ相手とは、感覚的な部分で深く分かり合える、貴重な関係になるはずです。逆に、鈍感で感情を軽視するタイプとは、すれ違いを感じることが多いかもしれません。",
      growth:"感受性の鋭さゆえに、周りの感情に影響されすぎてしまうことがあります。自分と他人の境界線を意識することで、より安定するでしょう。他人のネガティブな感情まで自分のことのように受け止めてしまうと、心が疲弊してしまうこともあります。「これは相手の感情であって、自分の感情ではない」と意識的に区別する練習をしてみてください。自分自身を守るための境界線を持つことが、これからのあなたにとって大切なテーマになるでしょう。" },
    22: { name:"構築の数(マスターナンバー)",
      personality:"大きな構想を思い描き、それを現実の形にしていく力を持つタイプです。理想と現実の両方を見据える視点があります。壮大な目標を掲げても、それを実現するための具体的な計画を立てられる実行力があります。夢見がちな部分と、地に足のついた現実的な部分を併せ持っているのではないでしょうか。周囲からは大きなことを成し遂げそうな人として見られることが多いタイプです。理想を語るだけでなく、それを形にするまでやり遂げる粘り強さを持っています。",
      past:"一つのことにじっくり時間をかけて形にしてきた経験があるのではないでしょうか。その積み重ねは、たとえ途中であっても確実に力になっています。大きな目標を掲げたものの、思うように進まず苦しんだ時期もあったかもしれません。それでも投げ出さずに続けてきたことが、今のあなたの実現力の土台になっています。理想が高い分、周囲との温度差を感じることもあったかもしれませんが、その姿勢は決して間違っていません。",
      future:"焦る必要はありません。これまで積み上げてきたものを、一つずつ形にしていってください。時間はかかっても、それは着実に実を結びます。壮大な目標も、小さな一歩の積み重ねによって現実になっていきます。周囲を巻き込みながら、あなたの構想を少しずつ共有していくことで、実現のスピードも上がっていくはずです。これからも理想と現実、両方の視点を大切にしながら進んでいってください。",
      message:"大きな夢を、静かに形にしていける人です。",
      compat:"4(誠実)・8(実現)・11(直感)の数を持つ相手と相性が良いでしょう。あなたの構想力を、共に形にしていける組み合わせです。4の数を持つ相手とは、地道な作業を分担しながら、着実に計画を進めていけるでしょう。8の数を持つ相手とは、実行力を掛け合わせて大きな成果を生み出せる関係になります。11の数を持つ相手とは、直感的なひらめきを構想に取り入れる、刺激的なパートナーシップを築けるはずです。逆に、目先のことしか考えないタイプとは、視点の違いに苦労することがあるかもしれません。",
      growth:"理想が高い分、完璧を求めすぎて動けなくなることがあります。「今できる範囲」から始める意識を持つと、物事が前に進みやすくなるでしょう。すべての条件が整うのを待っていると、貴重な時間を逃してしまうこともあります。完璧な計画よりも、まず小さく始めて修正していく柔軟さを持ってみてください。理想を追いながらも、今この瞬間にできることに目を向けることが、実現への近道になるはずです。" },
    33: { name:"慈愛の数(マスターナンバー)",
      personality:"見返りを求めず、誰かのために力を尽くそうとする、深い思いやりを持つタイプです。困っている人を放っておけない、強い共感力を持っています。自分の労力や時間を惜しまず、誰かの幸せのために動くことに喜びを感じるのではないでしょうか。周囲からは聖人のような人、無償の愛を持つ人として頼りにされることが多いタイプです。人の痛みに深く共感できる分、自分自身の感情との向き合い方が課題になることもあります。",
      past:"自分のことを後回しにしてでも、誰かを支えてきた場面が多かったのではないでしょうか。その献身は、静かでありながら、確かに誰かの支えになってきました。見返りを求めずに尽くしてきたことが、時に当たり前のように受け取られてしまった経験もあったかもしれません。それでも人のために力を尽くすことをやめなかった姿勢は、誰にでもできることではありません。あなたの献身は、言葉にされなくても、多くの人の心に確かに残っています。",
      future:"人を思う気持ちを大切にしながら、自分自身のことも同じだけ大切にする時間を持ってください。その両方があって、初めて長く続けていけます。誰かに与えることと同じくらい、自分自身が満たされる時間を意識的に作っていってください。すべてを背負い込もうとせず、時には人に頼ることも受け入れてみましょう。あなたの深い思いやりが、これからも無理なく長く続いていくことを願っています。",
      message:"見返りを求めない優しさを持つ、稀有な人です。",
      compat:"6(思いやり)・9(包容)・22(構築)の数を持つ相手と相性が良いでしょう。あなたの献身を理解し、支え合える組み合わせです。6の数を持つ相手とは、お互いの優しさを認め合える、温かい関係を築けるでしょう。9の数を持つ相手とは、広い視野と深い思いやりを分かち合える、稀有な関係になります。22の数を持つ相手とは、あなたの献身を形あるものにしていける、頼もしいパートナーシップを築けるはずです。逆に、自分本位で見返りを求めるタイプとは、一方的な関係になりやすいので注意が必要です。",
      growth:"献身的すぎるあまり、自分を犠牲にしすぎてしまうことがあります。与えるばかりでなく、受け取ることも自分に許してあげましょう。すべての人を助けようとすると、自分自身の心や体に大きな負担がかかってしまうこともあります。「自分を大切にすることは、周りを大切にすることにもつながる」と意識してみてください。時には誰かに甘えることも、あなたにとって必要な休息になるはずです。" }
  };

  function digitSum(str){
    var sum = 0;
    for (var i=0; i<str.length; i++){ sum += parseInt(str[i], 10); }
    return sum;
  }

  function lifePathNumber(y, m, d){
    var str = String(y) + String(m).padStart(2,'0') + String(d).padStart(2,'0');
    var n = digitSum(str);
    while (n > 9 && n !== 11 && n !== 22 && n !== 33){
      n = digitSum(String(n));
    }
    return n;
  }

  var yearSel = document.getElementById('numero-year');
  var monthSel = document.getElementById('numero-month');
  var daySel = document.getElementById('numero-day');
  var btn = document.getElementById('numero-submit');
  var errorEl = document.getElementById('numero-error');
  var resultEl = document.getElementById('numero-result');

  function fillSelect(sel, start, end, label, pad){
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = label;
    sel.appendChild(placeholder);
    for (var i = start; i <= end; i++){
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = pad ? (i < 10 ? '0' + i : i) + label : i + label;
      sel.appendChild(opt);
    }
  }
  fillSelect(yearSel, 1930, 2090, '年', false);
  fillSelect(monthSel, 1, 12, '月', false);
  fillSelect(daySel, 1, 31, '日', false);

  btn.addEventListener('click', function(){
    errorEl.textContent = '';
    var y = parseInt(yearSel.value, 10);
    var m = parseInt(monthSel.value, 10);
    var d = parseInt(daySel.value, 10);
    if (!yearSel.value || !monthSel.value || !daySel.value){
      errorEl.textContent = '年・月・日をすべて選択してください';
      return;
    }
    var check = new Date(y, m - 1, d);
    if (check.getFullYear() !== y || check.getMonth() !== m - 1 || check.getDate() !== d){
      errorEl.textContent = '有効な日付を選択してください';
      return;
    }
    var num = lifePathNumber(y, m, d);
    var data = DATA[num];

    document.getElementById('numero-num-value').textContent = num;
    document.getElementById('numero-num-name').textContent = data.name;
    document.getElementById('numero-personality').textContent = data.personality;
    document.getElementById('numero-past').textContent = data.past;
    document.getElementById('numero-future').textContent = data.future;
    document.getElementById('numero-compat').textContent = data.compat;
    document.getElementById('numero-growth').textContent = data.growth;
    document.getElementById('numero-message').textContent = '「' + data.message + '」';

    resultEl.classList.add('is-visible');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });
})();
</script>
