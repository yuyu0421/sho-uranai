<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日の占い｜明鏡止水の翔</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#D9E6E5;
    --panel:#EFF6F5;
    --ink:#20313A;
    --ink-soft:#4F6669;
    --accent:#1F6F78;
    --accent-soft:#6FA8AC;
    --line:#B9D2D0;
    --highlight:#9C6B4F;
  }
  .daily-wrap *{ box-sizing:border-box; }
  .daily-wrap{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    max-width:560px;
    margin:0 auto;
    padding:40px 28px 48px;
    line-height:1.9;
  }
  .daily-signature{
    text-align:center;
    font-size:11.5px;
    letter-spacing:0.15em;
    color:var(--accent-soft);
    margin-bottom:10px;
  }
  .daily-ripple{
    display:block;
    margin:0 auto 18px;
  }
  .daily-lead{
    text-align:center;
    margin-bottom:32px;
  }
  .daily-lead .daily-title{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.04em;
    margin:0 0 12px;
  }
  .daily-lead p{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
  }
  .daily-person-row{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .daily-person-row select{
    width:220px;
  }
  .daily-name-input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 12px;
    width:220px;
    text-align:center;
  }
  .daily-name-input:focus{
    outline:none;
    border-color:var(--accent-soft);
  }
  .daily-checkbox-label{
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .daily-new-entry{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .daily-link{
    font-size:12px;
    color:var(--accent-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    padding:0;
  }
  .daily-form{
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:28px 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .daily-form label{
    font-size:13.5px;
    color:var(--ink-soft);
  }
  .daily-date-row{
    display:flex;
    gap:10px;
  }
  .daily-select{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    color:var(--ink);
    background-color:var(--panel);
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1L6 6L11 1' fill='none' stroke='%231F6F78' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:11px 7px;
    border:1px solid var(--line);
    border-radius:3px;
    padding:10px 26px 10px 10px;
    text-align:center;
    -webkit-appearance:none;
    appearance:none;
  }
  .daily-select:focus{
    outline:none;
    border-color:var(--accent-soft);
  }
  .daily-btn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    letter-spacing:0.05em;
    color:var(--accent);
    background:transparent;
    border:1px solid var(--accent);
    border-radius:3px;
    padding:11px 34px;
    cursor:pointer;
    transition:background 0.25s ease, color 0.25s ease;
  }
  .daily-btn:hover, .daily-btn:focus-visible{
    background:var(--accent);
    color:#fff;
    outline:none;
  }
  .daily-note{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
  .daily-error{
    color:var(--highlight);
    font-size:13px;
    min-height:16px;
  }
  .daily-result{
    margin-top:36px;
    opacity:0;
    max-height:0;
    overflow:hidden;
    transition:opacity 0.6s ease;
  }
  .daily-result.is-visible{
    opacity:1;
    max-height:none;
  }
  .daily-date-display{
    text-align:center;
    font-family:'Shippori Mincho', serif;
    font-size:15px;
    color:var(--accent);
    margin-bottom:8px;
  }
  .daily-section{
    margin-top:26px;
  }
  .daily-section h3{
    font-family:'Shippori Mincho', serif;
    font-weight:500;
    font-size:15px;
    color:var(--accent);
    margin:0 0 10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .daily-section p{
    margin:0;
    font-size:15px;
    color:var(--ink);
  }
  .daily-close{
    margin-top:34px;
    padding-top:26px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .daily-close p{
    font-family:'Shippori Mincho', serif;
    font-size:15.5px;
    color:var(--ink-soft);
    margin:0;
  }
  .daily-signoff{
    display:block;
    margin-top:14px;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--accent-soft);
  }
  @media (prefers-reduced-motion: reduce){
    .daily-result{ transition:none; }
  }
</style>

<div class="daily-wrap">
  <div class="daily-lead">
    <p class="daily-signature">明鏡止水の翔</p>
    <svg class="daily-ripple" width="72" height="40" viewBox="0 0 72 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="20" r="4" fill="none" stroke="#1F6F78" stroke-width="1.3" opacity="0.85"/>
      <circle cx="36" cy="20" r="11" fill="none" stroke="#1F6F78" stroke-width="1.1" opacity="0.5"/>
      <circle cx="36" cy="20" r="18" fill="none" stroke="#1F6F78" stroke-width="0.9" opacity="0.25"/>
    </svg>
    <p class="daily-title">今日の占い</p>
    <p>生年月日から、今日のあなたの運勢を静かに映し出します。</p>
  </div>

  <div class="daily-form">
    <div class="daily-person-row" id="daily-person-row" style="display:none;">
      <label for="daily-person-select">見る相手を選んでください</label>
      <select id="daily-person-select" class="daily-select"></select>
      <button type="button" class="daily-link" id="daily-delete-link">この人を削除する</button>
      <button type="button" class="daily-link" id="daily-change-link">別の生年月日で占う</button>
    </div>

    <div class="daily-new-entry" id="daily-new-entry">
      <input type="text" id="daily-name" class="daily-name-input" placeholder="お名前(任意・例：自分)">
      <label for="daily-year">生年月日を選択してください</label>
      <div class="daily-date-row">
        <select id="daily-year" class="daily-select" aria-label="年"></select>
        <select id="daily-month" class="daily-select" aria-label="月"></select>
        <select id="daily-day" class="daily-select" aria-label="日"></select>
      </div>
      <label class="daily-checkbox-label">
        <input type="checkbox" id="daily-save-check" checked>
        次回のために保存する
      </label>
    </div>

    <div class="daily-error" id="daily-error"></div>
    <button type="button" class="daily-btn" id="daily-submit">占う</button>
    <p class="daily-note">※同じ日であれば、何度占っても同じ結果が表示されます。</p>
  </div>

  <div class="daily-result" id="daily-result">
    <p class="daily-date-display" id="daily-date-display"></p>

    <div class="daily-section">
      <h3>総合運</h3>
      <p id="daily-sougou"></p>
    </div>
    <div class="daily-section">
      <h3>仕事運</h3>
      <p id="daily-shigoto"></p>
    </div>
    <div class="daily-section">
      <h3>恋愛運</h3>
      <p id="daily-renai"></p>
    </div>
    <div class="daily-section">
      <h3>金運</h3>
      <p id="daily-okane"></p>
    </div>

    <div class="daily-close">
      <p id="daily-message"></p>
      <span class="daily-signoff">— 明鏡止水の翔</span>
    </div>
  </div>
</div>

<script>

    message: [

      "無理に急がなくても、道はちゃんと続いています。",

      "あなたのペースが、一番の正解です。",

  function hashStr(str){
    var h = 5381;
    for (var i = 0; i < str.length; i++){
      h = ((h << 5) + h) + str.charCodeAt(i);
      h = h & 0xFFFFFFFF;
    }
    return Math.abs(h);
  }

  function pick(pool, seedBase, salt){
    var idx = hashStr(seedBase + salt) % pool.length;
    return pool[idx];
  }

  var safeStorage = {
    get: function(key){
      try { return JSON.parse(window.localStorage.getItem(key) || 'null'); }
      catch(e){ return null; }
    },
    set: function(key, val){
      try { window.localStorage.setItem(key, JSON.stringify(val)); return true; }
      catch(e){ return false; }
    }
  };
  var STORAGE_KEY = 'meikyo_daily_people';

  var personRow = document.getElementById('daily-person-row');
  var personSelect = document.getElementById('daily-person-select');
  var newEntry = document.getElementById('daily-new-entry');
  var changeLink = document.getElementById('daily-change-link');
  var deleteLink = document.getElementById('daily-delete-link');
  var nameInput = document.getElementById('daily-name');
  var saveCheck = document.getElementById('daily-save-check');

  var yearSel = document.getElementById('daily-year');
  var monthSel = document.getElementById('daily-month');
  var daySel = document.getElementById('daily-day');
  var btn = document.getElementById('daily-submit');
  var errorEl = document.getElementById('daily-error');
  var resultEl = document.getElementById('daily-result');

  function fillSelect(sel, start, end, label){
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = label;
    sel.appendChild(placeholder);
    for (var i = start; i <= end; i++){
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i + label;
      sel.appendChild(opt);
    }
  }
  fillSelect(yearSel, 1930, 2015, '年');
  fillSelect(monthSel, 1, 12, '月');
  fillSelect(daySel, 1, 31, '日');

  function getPeople(){
    var list = safeStorage.get(STORAGE_KEY);
    return Array.isArray(list) ? list : [];
  }

  function refreshPersonSelect(selectIndex){
    var people = getPeople();
    personSelect.innerHTML = '';
    people.forEach(function(p, idx){
      var opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = p.name || ('登録' + (idx + 1));
      personSelect.appendChild(opt);
    });
    var newOpt = document.createElement('option');
    newOpt.value = 'new';
    newOpt.textContent = '＋ 新しく入力する';
    personSelect.appendChild(newOpt);

    if (people.length > 0){
      personRow.style.display = 'flex';
      personSelect.value = (typeof selectIndex !== 'undefined') ? String(selectIndex) : '0';
      var isNewNow = (personSelect.value === 'new' || personSelect.selectedIndex === -1);
      newEntry.style.display = isNewNow ? 'flex' : 'none';
      deleteLink.style.display = isNewNow ? 'none' : 'inline';
    } else {
      personRow.style.display = 'none';
      newEntry.style.display = 'flex';
    }
  }

  personSelect.addEventListener('change', function(){
    var isNew = personSelect.value === 'new';
    newEntry.style.display = isNew ? 'flex' : 'none';
    deleteLink.style.display = isNew ? 'none' : 'inline';
  });
  changeLink.addEventListener('click', function(){
    personSelect.value = 'new';
    newEntry.style.display = 'flex';
  });
  deleteLink.addEventListener('click', function(){
    if (personSelect.value === 'new') { return; }
    var idx = parseInt(personSelect.value, 10);
    var people = getPeople();
    var target = people[idx];
    var ok = window.confirm((target && target.name ? target.name : 'この人') + 'を削除しますか？この操作は取り消せません。');
    if (!ok) { return; }
    people.splice(idx, 1);
    safeStorage.set(STORAGE_KEY, people);
    refreshPersonSelect(0);
  });

  refreshPersonSelect();

  btn.addEventListener('click', function(){
    errorEl.textContent = '';
    var people = getPeople();
    var y, m, d, displayName;

    var useSaved = personRow.style.display !== 'none' && personSelect.value !== 'new';

    if (useSaved){
      var person = people[parseInt(personSelect.value, 10)];
      y = person.y; m = person.m; d = person.d; displayName = person.name;
    } else {
      y = parseInt(yearSel.value, 10);
      m = parseInt(monthSel.value, 10);
      d = parseInt(daySel.value, 10);
      if (!yearSel.value || !monthSel.value || !daySel.value){
        errorEl.textContent = '年・月・日をすべて選択してください';
        return;
      }
      var check = new Date(y, m - 1, d);
      if (check.getFullYear() !== y || check.getMonth() !== m - 1 || check.getDate() !== d){
        errorEl.textContent = '有効な日付を選択してください';
        return;
      }
      displayName = nameInput.value.trim();

      if (saveCheck.checked){
        people.push({ name: displayName || ('登録' + (people.length + 1)), y: y, m: m, d: d });
        safeStorage.set(STORAGE_KEY, people);
        refreshPersonSelect(people.length - 1);
      }
    }

    var today = new Date();
    var ty = today.getFullYear();
    var tm = today.getMonth() + 1;
    var td = today.getDate();
    var birthStr = y + '-' + m + '-' + d;
    var todayStr = ty + '-' + tm + '-' + td;
    var seedBase = birthStr + '_' + todayStr;

    var label = (displayName ? displayName + 'さんの' : '') + ty + '年' + tm + '月' + td + '日の占い';
    document.getElementById('daily-date-display').textContent = label;
    document.getElementById('daily-sougou').textContent = pick(POOL.sougou, seedBase, '_sougou');
    document.getElementById('daily-shigoto').textContent = pick(POOL.shigoto, seedBase, '_shigoto');
    document.getElementById('daily-renai').textContent = pick(POOL.renai, seedBase, '_renai');
    document.getElementById('daily-okane').textContent = pick(POOL.okane, seedBase, '_okane');
    document.getElementById('daily-message').textContent = '「' + pick(POOL.message, seedBase, '_message') + '」';

    resultEl.classList.add('is-visible');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  });
})();
</script>

</body>
</html>
